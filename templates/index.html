<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>clip</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0b1310; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b1310; }
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="__TOTAL__">
      <div id="el-s1" data-composition-id="s1-ask" data-composition-src="compositions/s1-ask.html" data-start="0" data-duration="__S1__" data-track-index="1" data-width="1080" data-height="1080"></div>
      <div id="el-s2" data-composition-id="s2-work" data-composition-src="compositions/s2-work.html" data-start="__S2_START__" data-duration="__S2__" data-track-index="1" data-width="1080" data-height="1080"></div>
      <div id="el-s3" data-composition-id="s3-tests" data-composition-src="compositions/s3-tests.html" data-start="__S3_START__" data-duration="__S3__" data-track-index="1" data-width="1080" data-height="1080"></div>
      <div id="el-s4" data-composition-id="s4-end" data-composition-src="compositions/s4-end.html" data-start="__S4_START__" data-duration="__S4__" data-track-index="1" data-width="1080" data-height="1080"></div>
    </div>
    <script>
      window.CLIP = /*__CLIP_DATA__*/null;
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
